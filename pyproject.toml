[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desplazamiento-feynman"
version = "0.1.0"
description = "Proyecto para estudiar el desplazamiento de Feynman."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]
